<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Summarizer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0f0f13;
      color: #e8e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header h1 {
      font-size: 2.4rem;
      font-weight: 700;
      background: linear-gradient(135deg, #6366f1, #a78bfa, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .header p {
      color: #6b7280;
      font-size: 1rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1e1e2e;
      border: 1px solid #2d2d3f;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.75rem;
      color: #a78bfa;
      margin-top: 10px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .card {
      background: #16161f;
      border: 1px solid #2d2d3f;
      border-radius: 16px;
      padding: 28px;
      width: 100%;
      max-width: 760px;
      margin-bottom: 20px;
    }

    .card label {
      display: block;
      font-size: 0.85rem;
      color: #9ca3af;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    textarea {
      width: 100%;
      height: 200px;
      background: #0f0f13;
      border: 1px solid #2d2d3f;
      border-radius: 10px;
      padding: 14px;
      font-size: 0.95rem;
      color: #e8e8f0;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    textarea:focus {
      border-color: #6366f1;
    }

    textarea::placeholder {
      color: #4b5563;
    }

    .char-count {
      text-align: right;
      font-size: 0.75rem;
      color: #4b5563;
      margin-top: 6px;
    }

    .char-count.warn { color: #f59e0b; }
    .char-count.error { color: #ef4444; }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
      transition: opacity 0.2s, transform 0.1s;
      letter-spacing: 0.02em;
    }

    button:hover { opacity: 0.9; transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .loading-bar {
      height: 3px;
      background: linear-gradient(90deg, #6366f1, #a78bfa, #38bdf8);
      border-radius: 2px;
      margin-top: 16px;
      animation: slide 1.2s infinite;
      display: none;
    }

    @keyframes slide {
      0% { transform: scaleX(0); transform-origin: left; }
      50% { transform: scaleX(1); transform-origin: left; }
      51% { transform: scaleX(1); transform-origin: right; }
      100% { transform: scaleX(0); transform-origin: right; }
    }

    .error-msg {
      background: #2d1515;
      border: 1px solid #7f1d1d;
      border-radius: 10px;
      padding: 14px;
      color: #fca5a5;
      font-size: 0.9rem;
      margin-top: 16px;
      display: none;
    }

    .results {
      display: none;
      width: 100%;
      max-width: 760px;
    }

    .result-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #e8e8f0;
      margin-bottom: 6px;
    }

    .meta {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .meta-badge {
      background: #1e1e2e;
      border: 1px solid #2d2d3f;
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 0.75rem;
      color: #6b7280;
    }

    .meta-badge span { color: #a78bfa; }

    .section-label {
      font-size: 0.75rem;
      color: #6366f1;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .summary-text {
      font-size: 1rem;
      line-height: 1.7;
      color: #d1d5db;
    }

    .bullets-list {
      list-style: none;
      padding: 0;
    }

    .bullets-list li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #1e1e2e;
      color: #d1d5db;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .bullets-list li:last-child { border-bottom: none; }

    .bullet-icon {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
      font-size: 10px;
    }

    .footer {
      margin-top: 40px;
      color: #374151;
      font-size: 0.8rem;
      text-align: center;
    }

    .footer a { color: #6366f1; text-decoration: none; }
  </style>
</head>
<body>

  <div class="header">
    <h1>AI Summarizer</h1>
    <p>Powered by Llama 3.1 via Groq — paste any text to get an instant summary</p>
    <div class="badge">
      <div class="dot"></div>
      Live · Llama 3.1 8B Instant
    </div>
  </div>

  <div class="card">
    <label>Input Text</label>
    <textarea id="inputText" placeholder="Paste an article, report, or any long text here (min 200 characters)..." oninput="updateCount()"></textarea>
    <div class="char-count" id="charCount">0 / 10,000</div>
    <button id="btn" onclick="summarizeText()">Summarize →</button>
    <div class="loading-bar" id="loadingBar"></div>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="results" id="results">
    <div class="card">
      <div class="result-title" id="titleOut"></div>
      <div class="meta">
        <div class="meta-badge">Latency: <span id="latency"></span>ms</div>
        <div class="meta-badge">Model: <span>Llama 3.1 8B</span></div>
      </div>
      <div class="section-label">Summary</div>
      <div class="summary-text" id="summaryOut"></div>
    </div>

    <div class="card">
      <div class="section-label">Key Points</div>
      <ul class="bullets-list" id="bulletsOut"></ul>
    </div>
  </div>

  <div class="footer">
    Built with FastAPI · Groq · SQLite · Docker · <a href="/docs" target="_blank">API Docs →</a>
  </div>

  <script>
    function updateCount() {
      const text = document.getElementById("inputText").value;
      const len = text.length;
      const el = document.getElementById("charCount");
      el.textContent = `${len.toLocaleString()} / 10,000`;
      el.className = "char-count" + (len > 9000 ? " error" : len > 7000 ? " warn" : "");
    }

    async function summarizeText() {
      const text = document.getElementById("inputText").value;
      const btn = document.getElementById("btn");
      const loadingBar = document.getElementById("loadingBar");
      const errorMsg = document.getElementById("errorMsg");
      const results = document.getElementById("results");

      errorMsg.style.display = "none";
      results.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Summarizing...";
      loadingBar.style.display = "block";

      try {
        const response = await fetch("/v1/summarize", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.detail || "Something went wrong");
        }

        const data = await response.json();

        document.getElementById("titleOut").textContent = data.title;
        document.getElementById("summaryOut").textContent = data.summary;
        document.getElementById("latency").textContent = data.latency_ms;

        const ul = document.getElementById("bulletsOut");
        ul.innerHTML = "";
        data.bullets.forEach(item => {
          const li = document.createElement("li");
          li.innerHTML = `<div class="bullet-icon">✦</div><span>${item}</span>`;
          ul.appendChild(li);
        });

        results.style.display = "block";
        results.scrollIntoView({ behavior: "smooth" });

      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Summarize →";
        loadingBar.style.display = "none";
      }
    }
  </script>
</body>
</html>
