version: '3.8'

services:
  app1:
    build: .
    env_file: .env
    expose:
      - "8000"

  app2:
    build: .
    env_file: .env
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app1
      - app2
